<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        :root { color-scheme:light dark; --cyan:#39b8c6; --blue:#559bd8; --green:#68b77a; --orange:#ed9d36; --line:color-mix(in srgb,currentColor 17%,transparent); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
        * { box-sizing:border-box; }
        html,body { width:100%; height:100%; margin:0; overflow:hidden; color:CanvasText; }
        body { padding:8px; }
        .card { position:relative; height:100%; min-height:250px; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--cyan) 9%,Canvas),transparent 43%),color-mix(in srgb,Canvas 94%,transparent); }
        .title-space { height:29px; }
        .stage { position:relative; height:calc(100% - 29px); min-height:213px; }
        .device { position:absolute; z-index:3; display:flex; flex-direction:column; align-items:center; text-align:center; }
        .device img { display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 7px 7px #0003); }
        .inverter { left:50%; top:0; width:32%; height:52%; transform:translateX(-50%); }
        .battery { left:5%; bottom:8px; width:27%; height:60%; }
        .meter { right:5%; bottom:11px; width:27%; height:54%; }
        .caption { position:absolute; z-index:5; padding:4px 7px; border:1px solid var(--line); border-radius:8px; background:color-mix(in srgb,Canvas 85%,transparent); box-shadow:0 3px 10px #0002; line-height:1.05; white-space:nowrap; backdrop-filter:blur(4px); }
        .caption b { display:block; font-size:.72rem; }
        .caption span { display:block; margin-top:2px; opacity:.66; font-size:.48rem; font-weight:700; }
        .inverter .caption { left:50%; bottom:-2px; transform:translateX(-50%); }
        .battery .caption { left:50%; bottom:0; transform:translateX(-50%); }
        .meter .caption { left:50%; bottom:0; transform:translateX(-50%); }
        .soc { position:absolute; z-index:4; left:-1px; bottom:31px; width:5px; height:44%; overflow:hidden; border-radius:4px; background:color-mix(in srgb,currentColor 12%,transparent); }
        .soc i { position:absolute; inset:auto 0 0; border-radius:4px; background:linear-gradient(var(--cyan),var(--green)); }
        .hub { position:absolute; z-index:5; left:50%; top:59%; transform:translate(-50%,-50%); padding:5px 9px; border:1px solid var(--line); border-radius:999px; background:Canvas; box-shadow:0 4px 12px #0002; text-align:center; }
        .hub small { display:block; opacity:.58; font-size:.42rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
        .hub strong { display:block; font-size:.7rem; }
        svg { position:absolute; z-index:1; inset:0; width:100%; height:100%; overflow:visible; }
        .wire { fill:none; stroke:color-mix(in srgb,currentColor 22%,transparent); stroke-width:2.2; stroke-linecap:round; }
        .flow { fill:none; stroke:var(--flow,var(--cyan)); stroke-width:2.4; stroke-linecap:round; stroke-dasharray:3 8; animation:move 1.1s linear infinite; opacity:.82; }
        .flow.reverse { animation-direction:reverse; }
        .flow.idle { opacity:.15; animation:none; }
        .pv-flow { --flow:var(--orange); }
        .battery-flow { --flow:var(--green); }
        .grid-flow { --flow:var(--blue); }
        .wire-label { font-size:3.2px; font-weight:800; letter-spacing:.08em; fill:currentColor; opacity:.42; }
        .status { position:absolute; z-index:5; top:1px; right:9px; width:7px; height:7px; border-radius:50%; background:#59b878; box-shadow:0 0 8px #59b878; }
        .status.bad { background:#d64c5f; box-shadow:0 0 8px #d64c5f; }
        @keyframes move { to { stroke-dashoffset:-22; } }
        @media(max-width:430px){ .caption b{font-size:.62rem}.caption span{font-size:.42rem}.inverter{width:35%}.battery,.meter{width:29%} }
        @media(prefers-reduced-motion:reduce){ .flow{animation:none} }
    </style>
</head>
<body>
<section class="card">
    <div class="title-space" aria-hidden="true"></div>
    <div class="stage">
        <i id="status" class="status"></i>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path class="wire" d="M50 39 V59 M27 69 C30 54 36 43 44 37 M54 59 H81 V72"/>
            <path id="pvFlow" class="flow pv-flow" d="M50 39 V59"/>
            <path id="batteryFlow" class="flow battery-flow" d="M27 69 C30 54 36 43 44 37"/>
            <path id="gridFlow" class="flow grid-flow" d="M81 72 V59 H54"/>
            <text class="wire-label" x="34" y="47">DC</text>
            <text class="wire-label" x="52" y="49">AC</text>
            <text class="wire-label" x="70" y="57">NETZ</text>
        </svg>
        <div class="device inverter">
            <img src="__INVERTER_IMAGE__" alt="Wechselrichter">
            <div class="caption"><b id="pvPower">– kW</b><span id="pvEnergy">Gesamt – kWh</span></div>
        </div>
        <div class="device battery">
            <div class="soc"><i id="socFill"></i></div>
            <img src="__BATTERY_IMAGE__" alt="Batteriespeicher">
            <div class="caption"><b id="batterySoc">– %</b><span id="batteryMode">Bereit</span></div>
        </div>
        <div class="device meter">
            <img src="__METER_IMAGE__" alt="Smart Meter">
            <div class="caption"><b id="gridPower">– kW</b><span id="gridMode">Netz</span></div>
        </div>
        <div class="hub"><small>Hausverbrauch</small><strong id="houseLoad">– kW</strong></div>
    </div>
</section>
<script>
const $=id=>document.getElementById(id),de=(v,d=2)=>Number(v).toFixed(d).replace('.',',');
function flow(id,mode,forward){const el=$(id);el.classList.toggle('idle',mode==='idle');el.classList.toggle('reverse',!forward)}
function render(s){
    $('pvPower').textContent=de(s.pvPower)+' kW';
    $('pvEnergy').textContent='Gesamt '+de(s.pvEnergy,1)+' kWh';
    $('batterySoc').textContent=de(s.batterySoc,0)+' %';
    $('socFill').style.height=Math.max(2,Math.min(100,Number(s.batterySoc)))+'%';
    $('batteryMode').textContent=s.batteryMode==='charge'?'Lädt '+de(s.batteryPower)+' kW':s.batteryMode==='discharge'?'Entlädt '+de(s.batteryPower)+' kW':'Bereit';
    $('gridPower').textContent=de(s.gridPower)+' kW';
    $('gridMode').textContent=s.gridMode==='import'?'Netzbezug':s.gridMode==='export'?'Einspeisung':'Netz ausgeglichen';
    $('houseLoad').textContent=de(s.houseLoad)+' kW';
    $('status').classList.toggle('bad',!s.valid);
    flow('pvFlow',s.pvPower>.03?'active':'idle',true);
    flow('batteryFlow',s.batteryMode,s.batteryMode==='discharge');
    flow('gridFlow',s.gridMode,s.gridMode==='import');
}
function handleMessage(data){render(typeof data==='string'?JSON.parse(data):data)}
render(__INITIAL_STATE__);
</script>
</body>
</html>
